<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-label="Held, but unreachable"><title>Held, but unreachable</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7c6118" stroke-width="2.2"/></pattern></defs><rect width="1040" height="640" fill="#ffffff"/><text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#15181c" text-anchor="start" font-weight="600">Held, but unreachable</text><text x="28" y="60" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">Same twelve questions, same stored relations, same scoring. Only the source of object identity changes.</text><rect x="28" y="74" width="984" height="50" rx="3" fill="#f6efdc" stroke="#7c6118" stroke-width="1"/><text x="40" y="95" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7c6118" text-anchor="start" font-weight="600">SCOPE  the hatched bar is identity_oracle: it consumes human-supplied identity.</text><text x="40" y="116" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7c6118" text-anchor="start" font-weight="600">It BOUNDS what the representation could express; it is not performance.</text><text x="306" y="168" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="end" font-weight="700">stored relations, human identity</text><rect x="320" y="152" width="240" height="24" rx="3" fill="#eef1f4"/><rect x="320" y="152" width="168.0" height="24" rx="3" fill="url(#hatch)" stroke="#7c6118" stroke-width="1"/><text x="574" y="169" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="626" y="169" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">F35</text><text x="672" y="169" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7c6118" text-anchor="start" font-weight="700">NOT DEPLOYABLE</text><text x="306" y="216" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="end" font-weight="normal">stored relations, grounded identity</text><rect x="320" y="200" width="240" height="24" rx="3" fill="#eef1f4"/><rect x="320" y="200" width="48.0" height="24" rx="3" fill="#0d6a70" stroke="none" stroke-width="1"/><text x="574" y="217" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">2/10</text><text x="626" y="217" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">F45</text><text x="306" y="264" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="end" font-weight="normal">stored relations, learned labels</text><rect x="320" y="248" width="240" height="24" rx="3" fill="#eef1f4"/><rect x="320" y="248" width="0.0" height="24" rx="3" fill="#e2e6ea" stroke="none" stroke-width="1"/><text x="574" y="265" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">0/10</text><text x="626" y="265" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">F40</text><text x="306" y="358" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="end" font-weight="normal">direct multiview RGB</text><rect x="320" y="342" width="240" height="24" rx="3" fill="#eef1f4"/><rect x="320" y="342" width="168.0" height="24" rx="3" fill="#0d6a70" stroke="none" stroke-width="1"/><text x="574" y="359" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="626" y="359" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">F50</text><text x="672" y="359" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d7548" text-anchor="start" font-weight="700">deployable: ties the bound on DIFFERENT items</text><path d="M 320 290 L 320 298 L 488.0 298 L 488.0 290" fill="none" stroke="#a2382c" stroke-width="1.4"/><text x="404.0" y="316" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#a2382c" text-anchor="middle" font-weight="700">the reachability gap: 7/10 held, 0/10 reached</text><text x="28" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="start" font-weight="normal">No additional serialization loss was measured: the stored-edge replay agrees with recomputed</text><text x="28" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="start" font-weight="normal">geometry 12 / 12 item for item [F63]. 7 of 12 items are ceiling-correct but delivered-unanswered</text><text x="28" y="440" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">[F64]; delivered-graph-unique wins 0 [F60].</text><line x1="28" y1="458" x2="1012" y2="458" stroke="#d3d9e0" stroke-width="1"/><text x="28" y="482" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c" text-anchor="start" font-weight="600">On the pilot room, direct RGB does not close it either</text><rect x="28" y="494" width="184" height="70" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="40" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#0d6a70" text-anchor="start" font-weight="700">5/10</text><text x="40" y="540" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">correct</text><text x="200" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="end" font-weight="normal">F76</text><rect x="224" y="494" width="184" height="70" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="236" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#1d7548" text-anchor="start" font-weight="700">0/10</text><text x="236" y="540" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">wrong</text><text x="396" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="end" font-weight="normal">F77</text><rect x="420" y="494" width="184" height="70" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="432" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#a2382c" text-anchor="start" font-weight="700">0/3</text><text x="432" y="540" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">cross-view items</text><text x="432" y="558" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">all declined</text><text x="592" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="end" font-weight="normal">F79</text><rect x="616" y="494" width="184" height="70" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="628" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#a2382c" text-anchor="start" font-weight="700">0.50</text><text x="628" y="540" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">exact accuracy</text><text x="628" y="558" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#a2382c" text-anchor="start" font-weight="700">FAIL (gate 0.60)</text><text x="788" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="end" font-weight="normal">F82</text><rect x="812" y="494" width="184" height="70" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="824" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#a2382c" text-anchor="start" font-weight="700">0.50</text><text x="824" y="540" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">coverage</text><text x="824" y="558" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#a2382c" text-anchor="start" font-weight="700">FAIL (gate 0.80)</text><text x="984" y="520" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="end" font-weight="normal">F83</text><text x="28" y="610" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">Accuracy when answered is 1.000 [F85] over the 5 items it answered: denominator 5, not 10.</text><text x="28" y="630" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">Both predeclared gates failed; no transfer claim is made [F88]. On the development rooms this arm was wrong 2/10 [F51].</text></svg>
