<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="566" viewBox="0 0 1040 566" role="img" aria-label="Held, but unreachable"><title>Held, but unreachable</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7c6118" stroke-width="2.2"/></pattern></defs><rect width="1040" height="566" fill="#ffffff"/><text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="start" font-weight="600">Held, but unreachable</text><text x="28" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="start" font-weight="normal">Same twelve questions, same stored relations, same scoring. Only the source of object identity changes.</text><rect x="28" y="66" width="984" height="26" rx="3" fill="#f6efdc" stroke="#7c6118" stroke-width="1"/><text x="40" y="83" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7c6118" text-anchor="start" font-weight="600">SCOPE  the hatched bar is identity_oracle — it consumes human-supplied identity. It BOUNDS what the representation could express; it is not performance.</text><text x="286" y="131" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#15181c" text-anchor="end" font-weight="700">stored relations, human identity</text><rect x="300" y="116" width="250" height="22" rx="3" fill="#eef1f4"/><rect x="300" y="116" width="175.0" height="22" rx="3" fill="url(#hatch)" stroke="#7c6118" stroke-width="1"/><text x="564" y="131" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="612" y="131" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#8b939c" text-anchor="start" font-weight="normal">F35</text><text x="646" y="131" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#7c6118" text-anchor="start" font-weight="700" letter-spacing="0.06em">NOT DEPLOYABLE</text><text x="286" y="177" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#15181c" text-anchor="end" font-weight="normal">stored relations, grounded identity</text><rect x="300" y="162" width="250" height="22" rx="3" fill="#eef1f4"/><rect x="300" y="162" width="50.0" height="22" rx="3" fill="#0d6a70" stroke="none" stroke-width="1"/><text x="564" y="177" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">2/10</text><text x="612" y="177" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#8b939c" text-anchor="start" font-weight="normal">F45</text><text x="286" y="223" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#15181c" text-anchor="end" font-weight="normal">stored relations, learned labels</text><rect x="300" y="208" width="250" height="22" rx="3" fill="#eef1f4"/><rect x="300" y="208" width="0.0" height="22" rx="3" fill="#e2e6ea" stroke="none" stroke-width="1"/><text x="564" y="223" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">0/10</text><text x="612" y="223" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#8b939c" text-anchor="start" font-weight="normal">F40</text><text x="286" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#15181c" text-anchor="end" font-weight="normal">direct multiview RGB</text><rect x="300" y="298" width="250" height="22" rx="3" fill="#eef1f4"/><rect x="300" y="298" width="175.0" height="22" rx="3" fill="#0d6a70" stroke="none" stroke-width="1"/><text x="564" y="313" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="612" y="313" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#8b939c" text-anchor="start" font-weight="normal">F50</text><text x="646" y="313" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1d7548" text-anchor="start" font-weight="700">deployable — ties the bound on DIFFERENT items</text><path d="M 300 248 L 300 256 L 475.0 256 L 475.0 248" fill="none" stroke="#a2382c" stroke-width="1.4"/><text x="387.5" y="271" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#a2382c" text-anchor="middle" font-weight="700">the reachability gap — 7/10 held, 0/10 reached</text><text x="28" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#15181c" text-anchor="start" font-weight="normal">Relation extraction is not the loss: the stored-edge replay agrees with recomputed geometry 12 / 12 item for item [F63].</text><text x="28" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="start" font-weight="normal">7 of 12 items are ceiling-correct but delivered-unanswered [F64]; delivered-graph-unique wins 0 [F60].</text><line x1="28" y1="390" x2="1012" y2="390" stroke="#d3d9e0" stroke-width="1"/><text x="28" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#15181c" text-anchor="start" font-weight="600">On a previously unseen room, direct RGB does not close it either</text><rect x="28" y="422" width="184" height="52" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="40" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#0d6a70" text-anchor="start" font-weight="700">5/10</text><text x="40" y="464" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b646e" text-anchor="start" font-weight="normal">correct</text><text x="200" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#8b939c" text-anchor="end" font-weight="normal">F76</text><rect x="224" y="422" width="184" height="52" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="236" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#1d7548" text-anchor="start" font-weight="700">0/10</text><text x="236" y="464" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b646e" text-anchor="start" font-weight="normal">wrong</text><text x="396" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#8b939c" text-anchor="end" font-weight="normal">F77</text><rect x="420" y="422" width="184" height="52" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="432" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#a2382c" text-anchor="start" font-weight="700">0/3</text><text x="432" y="464" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b646e" text-anchor="start" font-weight="normal">cross-view — all declined</text><text x="592" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#8b939c" text-anchor="end" font-weight="normal">F79</text><rect x="616" y="422" width="184" height="52" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="628" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#a2382c" text-anchor="start" font-weight="700">0.50</text><text x="628" y="464" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b646e" text-anchor="start" font-weight="normal">exact accuracy — FAIL (gate 0.60)</text><text x="788" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#8b939c" text-anchor="end" font-weight="normal">F82</text><rect x="812" y="422" width="184" height="52" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="824" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#a2382c" text-anchor="start" font-weight="700">0.50</text><text x="824" y="464" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b646e" text-anchor="start" font-weight="normal">coverage — FAIL (gate 0.80)</text><text x="984" y="446" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#8b939c" text-anchor="end" font-weight="normal">F83</text><text x="28" y="540" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b939c" text-anchor="start" font-weight="normal">Accuracy when answered is 1.000 [F85] over the 5 items it answered — denominator 5, not 10.</text><text x="28" y="556" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b939c" text-anchor="start" font-weight="normal">Both predeclared gates failed; no transfer claim is made [F88]. On the development rooms this same arm was wrong 2/10 [F51].</text></svg>
