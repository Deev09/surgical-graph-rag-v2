<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-label="The evaluation ladder"><title>The evaluation ladder</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7c6118" stroke-width="2.2"/></pattern></defs><rect width="1040" height="450" fill="#ffffff"/><text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="start" font-weight="600">The evaluation ladder</text><text x="28" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="start" font-weight="normal">Each layer holds the same pipeline fixed and changes one source of identity. Bars span the stages a layer relies on.</text><text x="28" y="72" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7c6118" text-anchor="start" font-weight="normal">Hatched layers consume human-supplied identity: bounds, never system performance.</text><text x="298.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">capture</text><line x1="298.0" y1="108" x2="298.0" y2="364" stroke="#d3d9e0" stroke-width="1"/><text x="394.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">segmentation</text><line x1="394.0" y1="108" x2="394.0" y2="364" stroke="#d3d9e0" stroke-width="1"/><text x="490.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">instance</text><text x="490.0" y="101" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">delivery</text><line x1="490.0" y1="108" x2="490.0" y2="364" stroke="#d3d9e0" stroke-width="1"/><text x="586.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">object</text><text x="586.0" y="101" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">naming</text><line x1="586.0" y1="108" x2="586.0" y2="364" stroke="#d3d9e0" stroke-width="1"/><text x="682.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">relation</text><text x="682.0" y="101" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">extraction</text><line x1="682.0" y1="108" x2="682.0" y2="364" stroke="#d3d9e0" stroke-width="1"/><text x="778.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8b939c" text-anchor="middle" font-weight="normal" letter-spacing="0.04em">answer</text><line x1="778.0" y1="108" x2="778.0" y2="364" stroke="#d3d9e0" stroke-width="1"/><text x="28" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#15181c" text-anchor="start" font-weight="600">geometry ceiling</text><text x="28" y="135" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8b939c" text-anchor="start" font-weight="normal">human identity + recomputed geometry</text><rect x="544" y="104" width="276" height="22" rx="3" fill="url(#hatch)" stroke="#7c6118" stroke-width="1"/><text x="832" y="120" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="878" y="120" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#7c6118" text-anchor="start" font-weight="700" letter-spacing="0.06em">NOT DEPLOYABLE</text><text x="28" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#15181c" text-anchor="start" font-weight="600">stored-edge replay</text><text x="28" y="187" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8b939c" text-anchor="start" font-weight="normal">human identity + serialized edges</text><rect x="640" y="156" width="180" height="22" rx="3" fill="url(#hatch)" stroke="#7c6118" stroke-width="1"/><text x="832" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="878" y="172" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#7c6118" text-anchor="start" font-weight="700" letter-spacing="0.06em">NOT DEPLOYABLE</text><text x="28" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#15181c" text-anchor="start" font-weight="600">delivered graph</text><text x="28" y="239" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8b939c" text-anchor="start" font-weight="normal">learned labels + serialized edges</text><rect x="544" y="208" width="276" height="22" rx="3" fill="#0d6a70" stroke="#0d6a70" stroke-width="1"/><text x="832" y="224" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#15181c" text-anchor="start" font-weight="700">0/10</text><text x="878" y="224" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#5b646e" text-anchor="start" font-weight="normal" letter-spacing="0.06em">delivered</text><text x="28" y="276" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#15181c" text-anchor="start" font-weight="600">grounded graph</text><text x="28" y="291" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8b939c" text-anchor="start" font-weight="normal">oracle-free grounding + serialized edges</text><rect x="544" y="260" width="276" height="22" rx="3" fill="#0d6a70" stroke="#0d6a70" stroke-width="1"/><text x="832" y="276" font-family="ui-monospace, 'SF Mono', Menlo, monospa