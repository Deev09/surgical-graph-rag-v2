<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="462" viewBox="0 0 1040 462" role="img" aria-label="The evaluation ladder"><title>The evaluation ladder</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7c6118" stroke-width="2.2"/></pattern></defs><rect width="1040" height="462" fill="#ffffff"/><text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#15181c" text-anchor="start" font-weight="600">The evaluation ladder</text><text x="28" y="60" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">Each arm reports its own declared path; bars span the stages an arm relies on. There is no shared mixed ladder.</text><text x="28" y="82" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7c6118" text-anchor="start" font-weight="normal">Hatched = human-supplied identity: a bound, never system performance.</text><text x="374.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">capture</text><line x1="374.0" y1="132" x2="374.0" y2="430" stroke="#d3d9e0" stroke-width="1"/><text x="462.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">segmentation</text><line x1="462.0" y1="132" x2="462.0" y2="430" stroke="#d3d9e0" stroke-width="1"/><text x="550.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">instance</text><text x="550.0" y="125" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">delivery</text><line x1="550.0" y1="132" x2="550.0" y2="430" stroke="#d3d9e0" stroke-width="1"/><text x="638.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">object</text><text x="638.0" y="125" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">naming</text><line x1="638.0" y1="132" x2="638.0" y2="430" stroke="#d3d9e0" stroke-width="1"/><text x="726.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">relation</text><text x="726.0" y="125" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">extraction</text><line x1="726.0" y1="132" x2="726.0" y2="430" stroke="#d3d9e0" stroke-width="1"/><text x="814.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="middle" font-weight="normal">answer</text><line x1="814.0" y1="132" x2="814.0" y2="430" stroke="#d3d9e0" stroke-width="1"/><text x="28" y="152" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c" text-anchor="start" font-weight="600">geometry ceiling</text><text x="28" y="172" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">human identity + recomputed geometry</text><rect x="599" y="137" width="254" height="26" rx="3" fill="url(#hatch)" stroke="#7c6118" stroke-width="1"/><text x="872" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="872" y="172" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7c6118" text-anchor="start" font-weight="700">NOT DEPLOYABLE</text><text x="28" y="214" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c" text-anchor="start" font-weight="600">stored-edge replay</text><text x="28" y="234" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">human identity + serialized edges</text><rect x="687" y="199" width="166" height="26" rx="3" fill="url(#hatch)" stroke="#7c6118" stroke-width="1"/><text x="872" y="214" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="872" y="234" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7c6118" text-anchor="start" font-weight="700">NOT DEPLOYABLE</text><text x="28" y="276" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c" text-anchor="start" font-weight="600">delivered graph</text><text x="28" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">learned labels + serialized edges</text><rect x="599" y="261" width="254" height="26" rx="3" fill="#0d6a70" stroke="#0d6a70" stroke-width="1"/><text x="872" y="276" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">0/10</text><text x="872" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">deployable</text><text x="28" y="338" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c" text-anchor="start" font-weight="600">grounded graph</text><text x="28" y="358" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">oracle-free grounding + serialized edges</text><rect x="599" y="323" width="254" height="26" rx="3" fill="#0d6a70" stroke="#0d6a70" stroke-width="1"/><text x="872" y="338" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">2/10</text><text x="872" y="358" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">deployable</text><text x="28" y="400" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c" text-anchor="start" font-weight="600">direct multiview RGB</text><text x="28" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">the images alone</text><rect x="335" y="385" width="518" height="26" rx="3" fill="#0d6a70" stroke="#0d6a70" stroke-width="1"/><text x="872" y="400" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#15181c" text-anchor="start" font-weight="700">7/10</text><text x="872" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">deployable</text></svg>
