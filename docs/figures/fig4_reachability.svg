<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-label="Per-arm reachability"><title>Per-arm reachability</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7c6118" stroke-width="2.2"/></pattern></defs><rect width="1040" height="620" fill="#ffffff"/><text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#15181c" text-anchor="start" font-weight="600">Per-arm reachability</text><text x="28" y="60" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">Each arm reports its own declared path; counts are questions surviving each stage. There is no mixed ladder.</text><rect x="28" y="74" width="984" height="30" rx="3" fill="#f6efdc" stroke="#7c6118" stroke-width="1"/><text x="40" y="95" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7c6118" text-anchor="start" font-weight="600">SCOPE  re-reads already-scored outcomes; the stored-human arm is identity_oracle — a BOUND, not performance.</text><text x="28" y="148" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c" text-anchor="start" font-weight="700">delivered graph</text><text x="185.0" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5b646e" text-anchor="start" font-weight="normal">learned labels; deployable path</text><text x="942" y="191" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#8b939c" text-anchor="start" font-weight="normal">[F40]</text><rect x="40" y="162" width="74" height="32" rx="4" fill="#0d6a70" stroke="#0d6a70" stroke-width="1"/><text x="77.0" y="183" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">10/10</text><rect x="204" y="162" width="74" height