<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-label="Where questions are lost"><title>Where questions are lost</title><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7c6118" stroke-width="2.2"/></pattern></defs><rect width="1040" height="520" fill="#ffffff"/><text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c" text-anchor="start" font-weight="600">Figure 4 — Where questions are lost</text><text x="28" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="start" font-weight="normal">One row per stage an answer must survive, over the 10 scored relation questions. Read top to bottom.</text><rect x="28" y="66" width="984" height="26" rx="3" fill="#f6efdc" stroke="#7c6118" stroke-width="1"/><text x="40" y="83" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7c6118" text-anchor="start" font-weight="600">SCOPE  bookkeeping over already-scored outcomes, not a new measurement. The held tile is identity_oracle — a BOUND, not performance. n = 10 over two rooms.</text><text x="318" y="131" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="end" font-weight="normal">a human answered it</text><rect x="330" y="116" width="420" height="22" rx="3" fill="#eef1f4"/><rect x="330" y="116" width="420.0" height="22" rx="3" fill="#0d6a70"/><text x="764" y="131" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">10/10</text><text x="318" y="175" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="end" font-weight="normal">objects are in the delivered partition</text><rect x="330" y="160" width="420" height="22" rx="3" fill="#eef1f4"/><rect x="330" y="160" width="336.0" height="22" rx="3" fill="#0d6a70"/><text x="764" y="175" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">8/10</text><text x="824" y="175" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b939c" text-anchor="start" font-weight="normal">−2 here</text><text x="318" y="219" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="end" font-weight="normal">NEAR can express the question</text><rect x="330" y="204" width="420" height="22" rx="3" fill="#eef1f4"/><rect x="330" y="204" width="336.0" height="22" rx="3" fill="#0d6a70"/><text x="764" y="219" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">8/10</text><text x="318" y="263" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="end" font-weight="normal">the serialized edge matches geometry</text><rect x="330" y="248" width="420" height="22" rx="3" fill="#eef1f4"/><rect x="330" y="248" width="336.0" height="22" rx="3" fill="#0d6a70"/><text x="764" y="263" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">8/10</text><text x="318" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#15181c" text-anchor="end" font-weight="700">the bridge bound the anchors</text><rect x="330" y="292" width="420" height="22" rx="3" fill="#eef1f4"/><rect x="330" y="292" width="126.0" height="22" rx="3" fill="#0d6a70"/><text x="764" y="307" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#15181c" text-anchor="start" font-weight="700">3/10</text><text x="824" y="307" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#a2382c" text-anchor="start" font-weight="700">−5 here</text><text x="900" y="307" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#a2382c" text-anchor="start" font-weight="700" letter-spacing="0.05em">the dominant single loss</text><text x="318" y="351" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b646e" text-anchor="end" font-weight="normal">the delivered graph answered correctly</text><rect x="330" y="336" width="420" height="22" rx="3" fill="#eef1f4"/><text x="764" y="351" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#a2382c" text-anchor="start" font-weight="700">0/10</text><text x="824" y="351" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b939c" text-anchor="start" font-weight="normal">−3 here</text><line x1="28" y1="394" x2="1012" y2="394" stroke="#d3d9e0" stroke-width="1"/><text x="28" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#15181c" text-anchor="start" font-weight="600">Held by the representation, versus reached by a deployable path</text><rect x="28" y="428" width="212" height="58" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="40" y="452" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#7c6118" text-anchor="start" font-weight="700">7/10</text><text x="40" y="468" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5b646e" text-anchor="start" font-weight="normal">held — stored relations,</text><text x="40" y="481" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b939c" text-anchor="start" font-weight="normal">human identity [F35]</text><text x="228" y="452" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#7c6118" text-anchor="end" font-weight="700" letter-spacing="0.05em">NOT DEPLOYABLE</text><rect x="274" y="428" width="212" height="58" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="286" y="452" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#a2382c" text-anchor="start" font-weight="700">0/10</text><text x="286" y="468" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5b646e" text-anchor="start" font-weight="normal">reached — delivered graph</text><text x="286" y="481" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b939c" text-anchor="start" font-weight="normal">[F40]</text><rect x="520" y="428" width="212" height="58" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="532" y="452" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#a2382c" text-anchor="start" font-weight="700">2/10</text><text x="532" y="468" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5b646e" text-anchor="start" font-weight="normal">reached — grounded graph</text><text x="532" y="481" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b939c" text-anchor="start" font-weight="normal">[F45]</text><rect x="766" y="428" width="212" height="58" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="778" y="452" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#1d7548" text-anchor="start" font-weight="700">7/10</text><text x="778" y="468" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#5b646e" text-anchor="start" font-weight="normal">reached — direct RGB</text><text x="778" y="481" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b939c" text-anchor="start" font-weight="normal">[F50]</text><text x="28" y="508" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8b939c" text-anchor="start" font-weight="normal">Extraction is not the loss: no question is lost at the serialized-edge stage. Identity grounding is where they go.</text></svg>
