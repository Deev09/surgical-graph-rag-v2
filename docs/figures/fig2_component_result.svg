lo, monospace" font-size="8" fill="#8b939c" text-anchor="start" font-weight="normal">C02</text><rect x="690" y="226" width="150.0" height="15" rx="2" fill="#eef1f4"/><rect x="690" y="226" width="128.6" height="15" rx="2" fill="#0d6a70"/><text x="848.0" y="237.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#15181c" text-anchor="start" font-weight="700">18/21</text><text x="886.0" y="237.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b939c" text-anchor="start" font-weight="normal">top-3</text><text x="918.0" y="237.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#8b939c" text-anchor="start" font-weight="normal">C04</text><text x="28" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#15181c" text-anchor="start" font-weight="normal">The context control (41069021, rgb_context) scores BELOW rgb_tight at both ranks — 3/7 and 5/7 against 5/7 and 7/7.</text><text x="28" y="402" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b646e" text-anchor="start" font-weight="normal">More context hurts, which SUPPORTS the interpretation that the gain comes from object texture rather than room gist. It does not prove it.</text><text x="28" y="420" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5" fill="#8b939c" text-anchor="start" font-weight="normal">registry C01–C21</text></svg>
